[project]
name = "schemer"
version = "0.1.0"
description = "Generate readable schematic placement for Zener modules"
readme = "README.md"
authors = [
    { name = "Matt Clark", email = "matt@mattclark.net" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "playwright>=1.62.0",
]

[project.scripts]
schemer = "schemer.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["artifacts", "**/.pcb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
markers = [
    "e2e: compiler-backed stable Zener fixture tests",
    "viewer: opt-in actual installed-WASM rendering tests",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
